<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSK - Manhattan Subway Kings</title>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA_MEASUREMENT_ID');
  </script>
  <style>
    /* Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", Times, serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    a {
      color: #fff;
      text-decoration: underline;
    }

    a:hover {
      opacity: 0.8;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
    }

    .nav-logo {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-right a.contact-link {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 1rem;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-right a.contact-link:hover {
      opacity: 0.8;
    }

    .social-icons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-size: 1.1rem;
      transition: opacity 0.2s;
    }

    .social-icons a:hover {
      opacity: 0.7;
    }

    .social-icons svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* Main Content */
    main {
      padding: 60px 48px 80px;
      max-width: 1200px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 3rem;
      font-weight: 400;
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1.25rem;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .history-text {
      font-size: 1.05rem;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav {
        padding: 20px 24px;
      }

      .nav-right {
        gap: 16px;
      }

      .social-icons {
        gap: 14px;
      }

      main {
        padding: 40px 24px 60px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .history-text {
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      nav {
        padding: 16px 16px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-right {
        gap: 12px;
      }

      .nav-right a.contact-link {
        font-size: 0.9rem;
      }

      .social-icons {
        gap: 12px;
      }

      .social-icons svg {
        width: 18px;
        height: 18px;
      }

      main {
        padding: 32px 16px 48px;
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .history-text {
        font-size: 0.95rem;
        line-height: 1.7;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">MSK</a>
    <div class="nav-right">
      <div class="social-icons">
        <!-- Facebook -->
        <a href="https://www.facebook.com/profile.php?id=100078257617052#" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.508c-1.493 0-1.788.925-1.788 1.783v2.322h3.551l-.467 3.47h-3.084v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      </div>
    </div>
  </nav>

  <main>
    <h1>Manhattan Subway Kings</h1>

    <p class="subtitle">The History of Manhattan Subway Kings.</p>

    <p class="history-text">
      <strong>MSK</strong> originally began in the fall of 1983. <strong>CHI</strong>, <strong>FURN</strong>, <strong>MADE</strong>, <strong>WASE</strong> were the first 4 members. We all attended DeWitt Clinton High School in the Bronx.
    </p>
  </main>
</body>
</html>
